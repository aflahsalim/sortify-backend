<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sortify SOC Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ApexCharts -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <style>
    :root {
      --bg: #020617;
      --bg-alt: #02081b;
      --card: #020617;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #6b7280;
      --green: #22c55e;
      --cyan: #22d3ee;
      --amber: #fbbf24;
      --red: #f97373;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #02081b 0, #020617 45%, #020617 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    .refresh-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .refresh-btn:hover { border-color: var(--cyan); }

    .alert-banner {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(248,113,113,0.4);
      background: rgba(127,29,29,0.4);
      font-size: 13px;
      align-items: center;
      gap: 8px;
    }
    .alert-banner.active { display: flex; }

    .alert-icon {
      width: 18px; height: 18px;
      border-radius: 999px;
      border: 1px solid rgba(248,113,113,0.7);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      color: var(--red);
    }

    .grid-metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .metric-card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 10px 8px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 600;
    }

    .metric-safe { color: var(--green); }
    .metric-spam { color: var(--amber); }
    .metric-phish { color: #fb7185; }
    .metric-reported { color: var(--cyan); }

    .layout-main {
      display: grid;
      grid-template-columns: 2fr 1.4fr;
      gap: 12px;
      align-items: flex-start;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 10px 8px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: 40px repeat(24, 1fr);
      gap: 2px;
      font-size: 9px;
    }

    .heatmap-cell {
      height: 14px;
      border-radius: 3px;
      background: #020617;
    }

    .heatmap-cell.level-1 { background: rgba(34,197,94,0.25); }
    .heatmap-cell.level-2 { background: rgba(34,197,94,0.45); }
    .heatmap-cell.level-3 { background: rgba(34,197,94,0.7); }
    .heatmap-cell.level-4 { background: rgba(34,197,94,0.9); }

    .trend-chart { height: 160px; }

    .leaderboard-table,
    .scans-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .leaderboard-table th,
    .leaderboard-table td,
    .scans-table th,
    .scans-table td {
      padding: 4px 6px;
      border-bottom: 1px solid #111827;
      text-align: left;
    }

    .leaderboard-table th,
    .scans-table th {
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 10px;
    }

    .scans-table tr { cursor: pointer; }
    .scans-table tr:hover { background: #02081b; }

    .label-pill {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .label-ham { background: rgba(34,197,94,0.1); color: var(--green); }
    .label-spam { background: rgba(251,191,36,0.1); color: var(--amber); }
    .label-phishing { background: rgba(248,113,113,0.1); color: #fb7185; }
    .label-support { background: rgba(34,211,238,0.1); color: var(--cyan); }

    .export-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .export-btn {
      flex: 1;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }
    .export-btn:hover { border-color: var(--cyan); color: var(--text); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.active { display: flex; }

    .modal {
      background: #020617;
      border-radius: 12px;
      border: 1px solid var(--border);
      max-width: 520px;
      width: 100%;
      padding: 14px 14px 12px;
      max-height: 80vh;
      overflow: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--cyan);
    }

    .modal-close {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
    }

    .modal-section-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 8px;
      margin-bottom: 2px;
    }

    .modal-body {
      font-size: 12px;
      color: var(--text);
      white-space: pre-wrap;
      background: #02081b;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid #111827;
    }

    .modal-meta {
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const API = "https://sortify-backend-hwf9d0exgqdub9cn.canadacentral-01.azurewebsites.net";
  </script>

  <script src="index.js"></script>
</body>
</html>
